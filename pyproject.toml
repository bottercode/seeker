[project]
name = "seeker"
version = "0.1.0"
description = "Open-source semantic web search with an Exa-compatible API and MCP server"
readme = "README.md"
authors = [
    { name = "bottercode", email = "devanshdwivedi68@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "lancedb>=0.41.0",
    "mcp>=2.3.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "pylance>=14.0.2",
    "sentence-transformers>=6.2.0",
    "tldextract>=5.4.0",
    "torch>=2.15.0",
    "trafilatura>=2.3.1",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
seeker = "seeker:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "exa-py>=2.28.0",
    "pytest>=9.2.0",
]
